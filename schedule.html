<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>日程表</title>
        <link rel="stylesheet" href="schedule.css" />
        <link rel="stylesheet" href="../font_0z41grrfpl9/iconfont.css" />
    </head>
    <body>
        <!-- 主体部分 -->
        <div class="app">
            <div class="header">
                <h1>todos</h1>
                <input type="text" placeholder="What needs to be done?" id="mainInput"/>
            </div>
            <!-- 中心 -->
            <div class="main"></div>
            <!-- 尾部 -->
            <div class="footer">
                <div class="activeItemCount">0 items left</div>
                <div class="function">
                    <span class="all">All</span>
                    <span class="active">Active</span>
                    <span class="completed">Completed</span>
                </div>
                <div class="clear">Clear completed</div>
            </div>
        </div>
        <!-- 结尾 -->
        <div class="end"></div>
        <script src="schedule.js"></script>
    </body>
</html>
